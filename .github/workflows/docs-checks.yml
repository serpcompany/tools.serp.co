name: Docs Checks

on:
  # No path filters: these checks take seconds, and a required check must report on every PR.
  pull_request:
  push:
    branches:
      - staging
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-docs:
    # CI_RUNNER_LABELS picks the runner; a fork's pull request always runs on
    # ubuntu-latest (docs/runbooks/ci-runners.md).
    runs-on: ${{ github.event.pull_request && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || fromJSON(vars.CI_RUNNER_LABELS || '"ubuntu-latest"') }}
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check doc sizes and names
        run: node .github/scripts/check-docs.mjs
