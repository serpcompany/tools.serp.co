name: PR Title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the title rule
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/check-pr-title.mjs
          sparse-checkout-cone-mode: false

      # The PR title becomes the squash commit and changelog line, so it must
      # be a Conventional Commit. The rule and its tests live in
      # scripts/check-pr-title.mjs.
      - name: Check the PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/check-pr-title.mjs
