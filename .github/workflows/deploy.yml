name: Deploy

# A push to `staging` deploys Staging; a push to `main` (a promotion) deploys
# Production. Each run builds, applies that environment's D1 migrations,
# deploys, and smoke-tests the live site (serp git-workflow standard, #188).
on:
  push:
    branches:
      - staging
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One deploy per environment at a time, and never cancel one halfway.
    concurrency:
      group: deploy-tools-serp-co-${{ github.ref_name == 'main' && 'production' || 'staging' }}
      cancel-in-progress: false
    env:
      DEPLOY_ENV: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      # CI tests through the Worker's *.workers.dev host with the smoke-test
      # header, so Bot Fight Mode on the branded domain can't block it.
      PLATFORM_URL: ${{ github.ref_name == 'main' && 'https://tools-serp-co.serpcompany.workers.dev' || 'https://tools-serp-co-staging.serpcompany.workers.dev' }}
      # The SERP account (docs/runbooks/cloudflare.md). Not secret.
      CLOUDFLARE_ACCOUNT_ID: cec5f04e1d18bcc65f2be0aefb04f059
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Only staging and main deploy
        if: github.ref_name != 'main' && github.ref_name != 'staging'
        run: |
          echo "::error::Deploy runs only for the staging and main branches."
          exit 1

      # Re-running an old run would deploy an older commit over a newer one.
      - name: Only the branch's current commit deploys
        run: |
          head="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/heads/${GITHUB_REF_NAME}" | cut -f1)"
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::error::$GITHUB_SHA is no longer the head of ${GITHUB_REF_NAME} ($head). Push or re-run the newest commit instead."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Before anything touches the environment, so a runtime-download flake
      # can't fail the run after a deploy.
      - name: Install pinned browser runtime
        if: env.DEPLOY_ENV == 'staging'
        run: pnpm exec playwright install --with-deps chromium

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: apps/tools/.next/cache
          key: nextjs-deploy-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nextjs-deploy-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      # Build first: a failed build must not leave migrations applied.
      - name: Build
        run: pnpm -C apps/tools cf:build:${DEPLOY_ENV}

      # Only these two steps can read the token.
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm -C apps/tools db:migrate:${DEPLOY_ENV}

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm -C apps/tools exec wrangler deploy --env ${DEPLOY_ENV}

      - name: Check the environment rules
        run: >-
          pnpm -C apps/tools audit:cf:api-smoke
          --base-url "$PLATFORM_URL"
          --expect-env "$DEPLOY_ENV"
          --platform-url "$PLATFORM_URL"

      # Staging only: the browser smoke records real tool runs, and production
      # telemetry must hold only real visitors' runs.
      - name: Run the browser smoke test
        if: env.DEPLOY_ENV == 'staging'
        run: pnpm -C apps/tools smoke:browser --base-url "$PLATFORM_URL"

      - name: Upload smoke failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-smoke-failure
          path: apps/tools/smoke-artifacts/
          if-no-files-found: ignore
          retention-days: 7
