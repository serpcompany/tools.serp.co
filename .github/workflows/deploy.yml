name: Deploy

# A push to `staging` deploys Staging; a push to `main` (a promotion) deploys
# Production. Each run applies that environment's D1 migrations, deploys, and
# smoke-tests the live site (serp git-workflow standard, issue #188).
on:
  push:
    branches:
      - staging
      - main
  workflow_dispatch:

permissions:
  contents: read

# One deploy per branch at a time, and never cancel one halfway.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_ENV: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      # CI tests through the Worker's *.workers.dev host with the smoke-test
      # header, so Bot Fight Mode on the branded domain can't block it.
      PLATFORM_URL: ${{ github.ref_name == 'main' && 'https://tools-serp-co.serpcompany.workers.dev' || 'https://tools-serp-co-staging.serpcompany.workers.dev' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # The SERP account (docs/runbooks/cloudflare.md). Not secret; pinned here
      # so the token is always used against the account it was created in.
      CLOUDFLARE_ACCOUNT_ID: cec5f04e1d18bcc65f2be0aefb04f059
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Only staging and main deploy
        if: github.ref_name != 'main' && github.ref_name != 'staging'
        run: |
          echo "::error::Deploy runs only for the staging and main branches."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply D1 migrations
        run: pnpm -C apps/tools db:migrate:${DEPLOY_ENV}

      - name: Build and deploy
        run: pnpm -C apps/tools deploy:${DEPLOY_ENV}

      - name: Check the environment rules
        run: >-
          pnpm -C apps/tools audit:cf:api-smoke
          --base-url "$PLATFORM_URL"
          --expect-env "$DEPLOY_ENV"
          --platform-url "$PLATFORM_URL"

      - name: Install pinned browser runtime
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the browser smoke test
        run: pnpm -C apps/tools smoke:browser --base-url "$PLATFORM_URL"

      - name: Upload smoke failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-smoke-failure
          path: apps/tools/smoke-artifacts/
          if-no-files-found: ignore
          retention-days: 7
