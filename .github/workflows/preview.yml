# Preview deployment workflow
#
# Deploys a Vercel preview on every push to a non-main branch and posts
# the URL as a PR comment so it can be reviewed before merging.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN      — Personal access token from https://vercel.com/account/tokens
#   VERCEL_ORG_ID     — Team/org ID shown in Vercel project settings
#   VERCEL_PROJECT_ID — Project ID shown in Vercel project settings

name: Preview Deployment

on:
  push:
    branches-ignore:
      - main

jobs:
  deploy-preview:
    name: Deploy to Vercel (preview)
    runs-on: ubuntu-latest
    permissions:
      contents: read       # needed by actions/checkout for private repos
      pull-requests: write  # needed to post the preview URL comment
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Vercel secrets
        id: vercel-secrets
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Vercel Actions secrets are not configured; skipping manual preview deploy."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.vercel-secrets.outputs.configured == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Setup Node.js
        if: steps.vercel-secrets.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Vercel CLI
        if: steps.vercel-secrets.outputs.configured == 'true'
        run: pnpm add -g vercel@latest

      - name: Pull Vercel environment
        if: steps.vercel-secrets.outputs.configured == 'true'
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build project
        if: steps.vercel-secrets.outputs.configured == 'true'
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel
        id: deploy
        if: steps.vercel-secrets.outputs.configured == 'true'
        run: |
          url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "preview_url=$url" >> "$GITHUB_OUTPUT"

      - name: Find existing PR comment
        uses: peter-evans/find-comment@v3
        id: find-comment
        if: steps.vercel-secrets.outputs.configured == 'true' && github.event_name == 'pull_request'
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: "<!-- vercel-preview -->"
        continue-on-error: true

      - name: Post / update preview URL comment
        uses: peter-evans/create-or-update-comment@v4
        if: steps.vercel-secrets.outputs.configured == 'true' && github.event_name == 'pull_request'
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            <!-- vercel-preview -->
            ## 🚀 Preview deployment ready

            | | |
            |---|---|
            | **URL** | ${{ steps.deploy.outputs.preview_url }} |
            | **Branch** | `${{ github.ref_name }}` |
            | **Commit** | `${{ github.sha }}` |

            > Updated on every push to this branch.
