name: Repository Check

on:
  pull_request:
  push:
    branches:
      - staging
      - main

permissions:
  contents: read

# A new push to a PR cancels that PR's older run. Every push run (staging or
# main) gets its own group, so each commit is checked (serp verification-cadence
# standard).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The pnpm store is cached by setup-node above. This restores Next.js's
      # incremental build cache (Next validates it), saves a fresh one every
      # run, and never reuses one built from a different lockfile.
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: apps/tools/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Run deterministic production check
        run: pnpm check

  # Builds the real Worker, applies every migration to a fresh local D1 with
  # Wrangler (as staging and production do), and drives the critical tools in
  # Chromium, including the telemetry write and dashboard read paths.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned browser runtime
        run: pnpm exec playwright install --with-deps chromium

      - name: Build the Worker with the local config
        run: pnpm -C apps/tools cf:build

      - name: Apply migrations to a fresh local D1
        run: pnpm -C apps/tools db:migrate:local

      - name: Start the Worker
        run: |
          # A throwaway dashboard token for this run's local Worker only.
          token="$(openssl rand -hex 16)"
          echo "::add-mask::$token"
          echo "INTERNAL_DASHBOARD_TOKEN=$token" >> "$GITHUB_ENV"
          nohup pnpm -C apps/tools exec wrangler dev --port 8787 \
            --var "INTERNAL_DASHBOARD_TOKEN:$token" > wrangler-dev.log 2>&1 &
          pid=$!
          for attempt in $(seq 1 90); do
            curl -sf --max-time 5 -o /dev/null http://localhost:8787/robots.txt && exit 0
            kill -0 "$pid" 2>/dev/null || break
            sleep 2
          done
          echo "::error::The Worker did not start"
          exit 1

      - name: Run the browser smoke test
        run: pnpm -C apps/tools smoke:browser --base-url http://localhost:8787 --require-dashboard

      - name: Show the Worker log
        if: failure()
        run: cat wrangler-dev.log || true

      - name: Upload smoke failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failure
          path: |
            wrangler-dev.log
            apps/tools/smoke-artifacts/
          if-no-files-found: ignore
          retention-days: 7
