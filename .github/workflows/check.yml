name: Repository Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# A new push to a PR cancels that PR's older run. Every main commit gets its
# own group, so each one is checked.
concurrency:
  group: check-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The pnpm store is cached by setup-node above. This restores Next.js's
      # incremental build cache; a source change still rebuilds what changed.
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: apps/tools/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/tools/**/*.ts', 'apps/tools/**/*.tsx', 'apps/tools/**/*.js', 'apps/tools/**/*.mjs', 'packages/*/src/**', '!**/node_modules/**', '!**/.next/**', '!**/.open-next/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Run deterministic production check
        run: pnpm check
